name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (GPU-Free Mock Backend)
    runs-on: ubuntu-latest

    env:
      PR_REVIEW_BACKEND: mock
      PR_REVIEW_DEVICE: cpu
      PR_REVIEW_MOCK_MODE: deterministic
      GITHUB_WEBHOOK_SECRET: ci-test-secret
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-ci.txt

      - name: Step 1 - Syntax & Bytecode Compilation Check
        run: |
          python -m compileall -q .

      - name: Step 2 - Core PR Review & API Server Tests
        run: |
          python test_pr_review_mvp.py
          python test_api_server.py

      - name: Step 3 - Mock Development Backend & Fix Agent Tests
        run: |
          python test_mock_backend.py
          python test_fix_agent.py

      - name: Step 4 - GitHub Webhook & Comment Client Tests
        run: |
          python test_webhook.py
          python test_github_client.py

      - name: Step 5 - Docker Setup & Configuration Audit Tests
        run: |
          python test_docker_setup.py

      - name: Step 6 - Bakeoff Framework Tests
        run: |
          python evaluation/benchmark_v2/test_bakeoff_framework.py

      - name: Step 7 - Benchmark V2 Validation & Semantic Audit
        run: |
          python evaluation/benchmark_v2/validate_benchmark.py
          python evaluation/benchmark_v2/ci_audit_runner.py
